<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notenwerte-Quiz</title>
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #172033;
    --muted: #657089;
    --accent: #3858d6;
    --accent-light: #e9edff;
    --border: #d9dfeb;
    --correct: #2e8b57;
    --correct-bg: #e9f7ef;
    --wrong: #c0392b;
    --wrong-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px 40px;
  }
  main { width: min(760px, 100%); }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 16px;
    margin-bottom: 18px;
  }
  .eyebrow {
    margin: 0 0 5px;
    color: var(--muted);
    font-size: .9rem;
    font-weight: 600;
  }
  h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.35rem); }
  .stats { color: var(--muted); font-size: .95rem; text-align: right; }
  .progress {
    height: 9px;
    background: #e1e6f0;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .progress-bar {
    height: 100%;
    width: 10%;
    background: var(--accent);
    border-radius: inherit;
    transition: width .25s ease;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: clamp(22px, 5vw, 38px);
    box-shadow: 0 8px 30px rgba(28, 42, 75, .07);
  }
  .question-number {
    color: var(--accent);
    font-weight: 700;
    font-size: .9rem;
    margin-bottom: 10px;
  }
  .question {
    font-size: clamp(1.15rem, 3.5vw, 1.45rem);
    line-height: 1.4;
    font-weight: 700;
    margin: 0 0 24px;
  }
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  button {
    font: inherit;
    cursor: pointer;
  }
  .choice {
    min-height: 58px;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: #fff;
    color: var(--text);
    padding: 12px 16px;
    text-align: left;
    font-weight: 600;
    transition: transform .1s ease, border-color .15s ease, background .15s ease;
  }
  .choice:hover:not(:disabled) {
    border-color: var(--accent);
    background: #fafbff;
    transform: translateY(-1px);
  }
  .choice:focus-visible, .next:focus-visible {
    outline: 3px solid #aab7ff;
    outline-offset: 2px;
  }
  .choice.correct { border-color: var(--correct); background: var(--correct-bg); }
  .choice.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .choice:disabled { cursor: default; }
  .feedback {
    min-height: 28px;
    margin-top: 18px;
    font-weight: 600;
    line-height: 1.4;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 18px;
  }
  .next {
    min-height: 48px;
    padding: 10px 20px;
    border: 0;
    border-radius: 13px;
    background: var(--accent);
    color: white;
    font-weight: 700;
  }
  .next:disabled { opacity: .4; cursor: not-allowed; }
  .result { text-align: center; }
  .result-score {
    font-size: clamp(3rem, 12vw, 5rem);
    font-weight: 800;
    line-height: 1;
    margin: 12px 0;
  }
  .result-message { color: var(--muted); line-height: 1.5; }
  .restart {
    margin-top: 20px;
    min-height: 50px;
    padding: 11px 22px;
    border: 0;
    border-radius: 13px;
    background: var(--accent);
    color: white;
    font-weight: 700;
  }
  .footer {
    text-align: center;
    color: var(--muted);
    font-size: .82rem;
    margin-top: 15px;
  }
  @media (max-width: 560px) {
    body { padding: 18px 12px 28px; }
    .header { align-items: start; flex-direction: column; }
    .stats { text-align: left; }
    .choices { grid-template-columns: 1fr; }
    .card { border-radius: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; transition: none !important; }
  }
</style>
</head>
<body>
<main id="app">
  <div class="header">
    <div>
      <p class="eyebrow">Musik · Notenwerte</p>
      <h1>🥁 Notenwerte-Quiz</h1>
    </div>
    <div class="stats">
      <div id="progressText">Frage 1 von 10</div>
      <strong id="scoreText">0 Punkte</strong>
    </div>
  </div>

  <div class="progress" aria-label="Quizfortschritt">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <section id="quizCard" class="card">
    <div id="questionNumber" class="question-number"></div>
    <p id="question" class="question"></p>
    <div id="choices" class="choices"></div>
    <div id="feedback" class="feedback" aria-live="polite"></div>
    <div class="actions">
      <button id="nextButton" class="next" type="button" disabled>Nächste Frage</button>
    </div>
  </section>

  <p class="footer">Bei jedem neuen Durchlauf werden 10 Fragen zufällig aus dem Fragenpool ausgewählt.</p>
</main>

<script>
(() => {
  "use strict";

  const questionPool = [
    {
      q: "Wie viele Zählzeiten hat eine Viertelnote im 4/4-Takt?",
      a: ["1", "2", "3", "4"],
      c: "1",
      e: "Eine Viertelnote entspricht im 4/4-Takt einer Zählzeit."
    },
    {
      q: "Wie viele Viertelnoten entsprechen einer halben Note?",
      a: ["1", "2", "3", "4"],
      c: "2",
      e: "Eine halbe Note dauert doppelt so lange wie eine Viertelnote."
    },
    {
      q: "Wie viele Viertelnoten entsprechen einer ganzen Note?",
      a: ["2", "3", "4", "8"],
      c: "4",
      e: "Eine ganze Note entspricht vier Viertelnoten."
    },
    {
      q: "Wie viele Achtelnoten entsprechen einer Viertelnote?",
      a: ["1", "2", "3", "4"],
      c: "2",
      e: "Eine Viertelnote hat die gleiche Dauer wie zwei Achtelnoten."
    },
    {
      q: "Welche Kombination ergibt genau eine ganze Note?",
      a: ["2 Viertelnoten", "4 Viertelnoten", "3 Viertelnoten", "2 Achtelnoten"],
      c: "4 Viertelnoten",
      e: "Vier Viertelnoten ergeben zusammen die Dauer einer ganzen Note."
    },
    {
      q: "Welche Kombination entspricht genau einer halben Note?",
      a: ["2 Viertelnoten", "1 Viertelnote", "4 Achtelnoten und 1 Viertelnote", "1 Achtelnote"],
      c: "2 Viertelnoten",
      e: "Zwei Viertelnoten haben zusammen die Dauer einer halben Note."
    },
    {
      q: "Wie viele Achtelnoten entsprechen einer halben Note?",
      a: ["2", "3", "4", "6"],
      c: "4",
      e: "Eine halbe Note entspricht vier Achtelnoten."
    },
    {
      q: "Welche Note ist doppelt so lang wie eine Viertelnote?",
      a: ["Achtelnote", "Halbe Note", "Ganze Note", "Sechzehntelnote"],
      c: "Halbe Note",
      e: "Eine halbe Note ist doppelt so lang wie eine Viertelnote."
    },
    {
      q: "Welche Kombination ergibt genau zwei Viertelnoten?",
      a: ["1 halbe Note", "1 ganze Note", "2 halbe Noten", "1 Achtelnote"],
      c: "1 halbe Note",
      e: "Eine halbe Note hat genau die Dauer von zwei Viertelnoten."
    },
    {
      q: "Ein 4/4-Takt enthält eine halbe Note. Wie viele Viertelnoten passen noch hinein?",
      a: ["1", "2", "3", "4"],
      c: "2",
      e: "Der 4/4-Takt umfasst vier Viertelnoten; nach einer halben Note bleiben zwei übrig."
    },
    {
      q: "Wie viele Sechzehntelnoten entsprechen einer Viertelnote?",
      a: ["2", "3", "4", "8"],
      c: "4",
      e: "Eine Viertelnote entspricht vier Sechzehntelnoten."
    },
    {
      q: "Wie viele Sechzehntelnoten entsprechen einer halben Note?",
      a: ["4", "6", "8", "16"],
      c: "8",
      e: "Eine halbe Note entspricht acht Sechzehntelnoten."
    },
    {
      q: "Welche Note dauert länger als eine Viertelnote?",
      a: ["Achtelnote", "Sechzehntelnote", "Halbe Note", "Keine davon"],
      c: "Halbe Note",
      e: "Die halbe Note ist länger als die Viertelnote."
    },
    {
      q: "Welche Note ist halb so lang wie eine Viertelnote?",
      a: ["Halbe Note", "Achtelnote", "Ganze Note", "Viertelnote"],
      c: "Achtelnote",
      e: "Eine Achtelnote dauert halb so lange wie eine Viertelnote."
    },
    {
      q: "Wie viele Achtelnoten passen in einen 4/4-Takt?",
      a: ["4", "6", "8", "12"],
      c: "8",
      e: "Vier Viertelnoten entsprechen acht Achtelnoten."
    },
    {
      q: "Wie viele Viertelnoten entsprechen zwei ganzen Noten?",
      a: ["4", "6", "8", "10"],
      c: "8",
      e: "Eine ganze Note entspricht vier Viertelnoten, also entsprechen zwei ganzen Noten acht Viertelnoten."
    },
    {
      q: "Eine ganze Note entspricht wie vielen halben Noten?",
      a: ["1", "2", "3", "4"],
      c: "2",
      e: "Eine ganze Note hat die Dauer von zwei halben Noten."
    },
    {
      q: "Eine halbe Note entspricht wie vielen Sechzehntelnoten?",
      a: ["4", "6", "8", "12"],
      c: "8",
      e: "Eine halbe Note entspricht acht Sechzehntelnoten."
    },
    {
      q: "Welche Kombination ergibt genau eine Viertelnote?",
      a: ["2 Achtelnoten", "2 Viertelnoten", "1 halbe Note", "4 Achtelnoten"],
      c: "2 Achtelnoten",
      e: "Zwei Achtelnoten haben zusammen die Dauer einer Viertelnote."
    },
    {
      q: "Welche Kombination ergibt genau eine halbe Note?",
      a: ["1 Achtelnote", "2 Achtelnoten", "4 Achtelnoten", "8 Achtelnoten"],
      c: "4 Achtelnoten",
      e: "Vier Achtelnoten entsprechen der Dauer einer halben Note."
    },
    {
      q: "Welche Kombination ergibt genau drei Viertelnoten?",
      a: ["1 halbe Note + 1 Viertelnote", "1 ganze Note", "2 halbe Noten", "2 Achtelnoten"],
      c: "1 halbe Note + 1 Viertelnote",
      e: "Eine halbe Note plus eine Viertelnote ergibt drei Viertelnoten."
    },
    {
      q: "Wie viele Sechzehntelnoten entsprechen einer ganzen Note?",
      a: ["8", "12", "16", "20"],
      c: "16",
      e: "Eine ganze Note entspricht vier Viertelnoten und damit sechzehn Sechzehntelnoten."
    },
    {
      q: "Wie viele Achtelnoten entsprechen zwei Viertelnoten?",
      a: ["2", "4", "6", "8"],
      c: "4",
      e: "Zwei Viertelnoten entsprechen vier Achtelnoten."
    },
    {
      q: "Wie viele Viertelnoten entsprechen drei halben Noten?",
      a: ["3", "4", "6", "8"],
      c: "6",
      e: "Jede halbe Note entspricht zwei Viertelnoten, also sind drei halbe Noten sechs Viertelnoten."
    }
  ];

  const $ = id => document.getElementById(id);
  const progressText = $("progressText");
  const scoreText = $("scoreText");
  const progressBar = $("progressBar");
  const questionNumber = $("questionNumber");
  const question = $("question");
  const choices = $("choices");
  const feedback = $("feedback");
  const nextButton = $("nextButton");
  const quizCard = $("quizCard");

  let questions = [];
  let current = 0;
  let score = 0;
  let answered = false;

  function shuffle(array) {
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function createRound() {
    questions = shuffle(questionPool)
      .slice(0, 10)
      .map(item => ({ ...item, answers: shuffle(item.a) }));

    current = 0;
    score = 0;
    answered = false;
    renderQuestion();
  }

  function renderQuestion() {
    const item = questions[current];
    answered = false;

    progressText.textContent = `Frage ${current + 1} von ${questions.length}`;
    scoreText.textContent = `${score} ${score === 1 ? "Punkt" : "Punkte"}`;
    progressBar.style.width = `${((current + 1) / questions.length) * 100}%`;

    questionNumber.textContent = `Frage ${current + 1}`;
    question.textContent = item.q;
    feedback.textContent = "";
    nextButton.disabled = true;
    nextButton.textContent = current === questions.length - 1
      ? "Ergebnis anzeigen"
      : "Nächste Frage";

    choices.innerHTML = "";

    item.answers.forEach(answer => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "choice";
      button.textContent = answer;
      button.addEventListener("click", () => chooseAnswer(answer, button));
      choices.appendChild(button);
    });
  }

  function chooseAnswer(selected, selectedButton) {
    if (answered) return;
    answered = true;

    const item = questions[current];
    const buttons = [...choices.querySelectorAll(".choice")];
    buttons.forEach(button => button.disabled = true);

    if (selected === item.c) {
      score++;
      selectedButton.classList.add("correct");
      feedback.textContent = "✓ Richtig! " + item.e;
    } else {
      selectedButton.classList.add("wrong");
      const correctButton = buttons.find(button => button.textContent === item.c);
      if (correctButton) correctButton.classList.add("correct");
      feedback.textContent = "Nicht ganz. Richtig ist: " + item.c + ". " + item.e;
    }

    scoreText.textContent = `${score} ${score === 1 ? "Punkt" : "Punkte"}`;
    nextButton.disabled = false;
  }

  function showResult() {
    const percent = Math.round((score / questions.length) * 100);

    quizCard.innerHTML = `
      <div class="result">
        <div class="question-number">Quiz beendet</div>
        <h2>Geschafft!</h2>
        <div class="result-score">${score} / ${questions.length}</div>
        <p class="result-message">
          Du hast <strong>${percent}%</strong> der Fragen richtig beantwortet.
        </p>
        <button id="restartButton" class="restart" type="button">Nochmal spielen</button>
      </div>
    `;

    $("restartButton").addEventListener("click", () => {
      quizCard.innerHTML = `
        <div id="questionNumber" class="question-number"></div>
        <p id="question" class="question"></p>
        <div id="choices" class="choices"></div>
        <div id="feedback" class="feedback" aria-live="polite"></div>
        <div class="actions">
          <button id="nextButton" class="next" type="button" disabled>Nächste Frage</button>
        </div>
      `;

      // Nach dem Neustart die DOM-Referenzen neu holen.
      location.reload();
    });
  }

  nextButton.addEventListener("click", () => {
    if (!answered) return;

    if (current < questions.length - 1) {
      current++;
      renderQuestion();
    } else {
      showResult();
    }
  });

  createRound();
})();
</script>
</body>
</html>
